services:
  - type: web
    name: presales-copilot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn webapp:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_EMBED_MODEL
        value: gemini-embedding-001
      - key: EMBED_BACKEND
        value: local
      - key: APP_ENV
        value: production
      - key: COPILOT_ACCESS_PASSWORD
        sync: false
      - key: MAX_DAILY_JOBS
        value: "5"
